<!DOCTYPE html>

<title>ハロプロ好き顔9選メーカー</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f6f6;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", Arial, sans-serif;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 20px 14px 50px;
}

h1 {
  text-align: center;
  font-size: 27px;
  margin: 10px 0 6px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 25px;
}

.screen {
  background: white;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.hidden {
  display: none !important;
}

/* =========================
   スタート
========================= */

.modeButtons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.modeButtons button {
  border: none;
  border-radius: 15px;
  padding: 17px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.trial {
  background: #eee;
  color: #222;
}

.standard {
  background: #222;
  color: white;
}

.gachi {
  background: #444;
  color: white;
}

.description {
  margin-top: 22px;
  color: #777;
  font-size: 13px;
  line-height: 1.7;
}

/* =========================
   ゲーム
========================= */

.round {
  text-align: center;
  font-weight: bold;
  margin-bottom: 8px;
}

.progress {
  width: 100%;
  height: 7px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progressBar {
  height: 100%;
  width: 0%;
  background: #222;
  transition: width .2s;
}

.question {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 18px;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.faceChoice {
  padding: 6px;
  background: white;
  border: 3px solid #eee;
  border-radius: 18px;
  cursor: pointer;
}

.faceChoice:active {
  transform: scale(.98);
}

.faceChoice img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  background: #eee;
}

.choiceName {
  text-align: center;
  padding: 9px 3px 2px;
  font-size: 14px;
  font-weight: bold;
}

.choiceGroup {
  text-align: center;
  padding: 2px 3px 7px;
  font-size: 11px;
  color: #888;
}

.otherChoices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.otherChoices button {
  min-height: 58px;
  border: none;
  border-radius: 14px;
  background: #eee;
  color: #222;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   結果
========================= */

.resultTitle {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

#resultCanvas {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
}

.resultButtons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.resultButtons button {
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-weight: bold;
}

.saveButton {
  background: #222;
  color: white;
}

.shareButton {
  background: #eee;
  color: #222;
}

.restart {
  width: 100%;
  margin-top: 10px;
  background: #eee;
}

.note {
  margin-top: 17px;
  color: #888;
  font-size: 11px;
  line-height: 1.7;
}
</style>
</head>

</div>

/* =====================================================
   ゲーム変数
===================================================== */

let ratings = [];

let totalRounds = 50;

let currentRound = 0;

let currentA = -1;

let currentB = -1;


/* =====================================================
   Elo初期化
===================================================== */

function initializeRatings() {

  ratings = [];

  for (
    let i = 0;
    i < members.length;
    i++
  ) {

    ratings.push(1000);

  }

}


/* =====================================================
   ゲーム開始
===================================================== */

function startGame(rounds) {

  if (members.length < 2) {

    alert(
      "候補者を2人以上登録してください。"
    );

    return;
  }


  totalRounds = rounds;

  currentRound = 0;

  initializeRatings();


  document
    .getElementById("startScreen")
    .classList.add("hidden");


  document
    .getElementById("gameScreen")
    .classList.remove("hidden");


  nextMatch();

}


/* =====================================================
   次の対戦
===================================================== */

function nextMatch() {

  if (
    currentRound >= totalRounds
  ) {

    finishGame();

    return;

  }


  currentA =
    Math.floor(
      Math.random() * members.length
    );


  do {

    currentB =
      Math.floor(
        Math.random() * members.length
      );

  }
  while (
    currentB === currentA
  );


  const a =
    members[currentA];

  const b =
    members[currentB];


  document
    .getElementById("imageA")
    .src = a.image;


  document
    .getElementById("imageB")
    .src = b.image;


  document
    .getElementById("nameA")
    .textContent = a.name;


  document
    .getElementById("nameB")
    .textContent = b.name;


  document
    .getElementById("groupA")
    .textContent = a.group;


  document
    .getElementById("groupB")
    .textContent = b.group;


  document
    .getElementById("roundText")
    .textContent =
      `${currentRound + 1} / ${totalRounds}`;


  document
    .getElementById("progressBar")
    .style.width =
      `${(currentRound / totalRounds) * 100}%`;

}


/* =====================================================
   左が好き
===================================================== */

function chooseLeft() {

  updateElo(
    currentA,
    currentB
  );

  nextRound();

}


/* =====================================================
   右が好き
===================================================== */

function chooseRight() {

  updateElo(
    currentB,
    currentA
  );

  nextRound();

}


/* =====================================================
   どちらでもない

   勝敗をつけない
===================================================== */

function chooseNeither() {

  nextRound();

}


/* =====================================================
   どっちも好き

   両者に同程度の評価を与える
   → Eloは変化させない
===================================================== */

function chooseBoth() {

  nextRound();

}


/* =====================================================
   次のラウンド
===================================================== */

function nextRound() {

  currentRound++;

  nextMatch();

}


/* =====================================================
   Elo計算
===================================================== */

function updateElo(
  winner,
  loser
) {

  const K = 32;


  const expectedWinner =
    1 /
    (
      1 +
      Math.pow(
        10,
        (
          ratings[loser] -
          ratings[winner]
        ) / 400
      )
    );


  const expectedLoser =
    1 - expectedWinner;


  ratings[winner] +=
    K *
    (1 - expectedWinner);


  ratings[loser] +=
    K *
    (0 - expectedLoser);

}


/* =====================================================
   結果
===================================================== */

function finishGame() {

  document
    .getElementById("gameScreen")
    .classList.add("hidden");


  document
    .getElementById("resultScreen")
    .classList.remove("hidden");


  const ranking =
    members
      .map(
        (member, index) => ({
          index: index,
          rating: ratings[index]
        })
      )
      .sort(
        (a, b) =>
          b.rating - a.rating
      );


  const top9 =
    ranking.slice(0, 9);


  drawResult(top9);

}


/* =====================================================
   結果画像
===================================================== */

function drawResult(top9) {

  const canvas =
    document.getElementById(
      "resultCanvas"
    );

  const ctx =
    canvas.getContext("2d");


  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    1080,
    1080
  );


  ctx.fillStyle =
    "#111111";

  ctx.textAlign =
    "center";

  ctx.font =
    "bold 46px sans-serif";


  ctx.fillText(
    "ハロプロ好き顔9選",
    540,
    52
  );


  const size = 325;

  const gap = 17;

  const startX = 35;

  const startY = 70;


  top9.forEach(
    (person, rank) => {

      const img =
        new Image();


      img.onload =
        function() {

          const col =
            rank % 3;

          const row =
            Math.floor(
              rank / 3
            );


          const x =
            startX +
            col *
            (size + gap);


          const y =
            startY +
            row *
            (size + gap);


          const scale =
            Math.max(
              size / img.width,
              size / img.height
            );


          const width =
            img.width * scale;

          const height =
            img.height * scale;


          ctx.save();

          ctx.beginPath();

          ctx.rect(
            x,
            y,
            size,
            size
          );

          ctx.clip();


          ctx.drawImage(
            img,
            x +
              (size - width) / 2,
            y +
              (size - height) / 2,
            width,
            height
          );


          ctx.restore();


          /* 順位 */

          ctx.fillStyle =
            "rgba(0,0,0,.75)";

          ctx.fillRect(
            x,
            y,
            70,
            52
          );


          ctx.fillStyle =
            "#ffffff";

          ctx.font =
            "bold 30px sans-serif";


          ctx.fillText(
            `#${rank + 1}`,
            x + 35,
            y + 36
          );


          /* 名前・グループ */

          ctx.fillStyle =
            "rgba(0,0,0,.78)";

          ctx.fillRect(
            x,
            y + size - 55,
            size,
            55
          );


          ctx.fillStyle =
            "#ffffff";

          ctx.font =
            "bold 17px sans-serif";


          ctx.fillText(
            members[
              person.index
            ].name,
            x + size / 2,
            y + size - 32
          );


          ctx.font =
            "12px sans-serif";


          ctx.fillText(
            members[
              person.index
            ].group,
            x + size / 2,
            y + size - 13
          );

        };


      img.src =
        members[
          person.index
        ].image;

    }
  );

}


/* =====================================================
   保存
===================================================== */

function saveResult() {

  const canvas =
    document.getElementById(
      "resultCanvas"
    );


  const link =
    document.createElement("a");


  link.download =
    "ハロプロ好き顔9選.png";


  link.href =
    canvas.toDataURL(
      "image/png"
    );


  link.click();

}


/* =====================================================
   共有
===================================================== */

async function shareResult() {

  const canvas =
    document.getElementById(
      "resultCanvas"
    );


  canvas.toBlob(
    async function(blob) {

      const file =
        new File(
          [blob],
          "ハロプロ好き顔9選.png",
          {
            type: "image/png"
          }
        );


      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files: [file]
        })
      ) {

        try {

          await navigator.share({
            files: [file],
            title:
              "ハロプロ好き顔9選"
          });

        }
        catch (error) {

        }

      }
      else {

        alert(
          "まず画像を保存してから共有してください。"
        );

      }

    },
    "image/png"
  );

}
