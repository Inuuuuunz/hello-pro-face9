<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハロプロ好き顔9選メーカー</title>

<style>
body {
  margin: 0;
  padding: 30px 15px;
  font-family: sans-serif;
  text-align: center;
  background: #f7f7f7;
}

.box {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
}

button {
  width: 100%;
  padding: 18px;
  margin: 10px 0;
  border: 0;
  border-radius: 15px;
  font-size: 18px;
  font-weight: bold;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<div class="box">

  <h1>ハロプロ好き顔9選メーカー</h1>

  <p>どのモードで遊ぶ？</p>

  <button onclick="startGame(100)">
    STANDARD<br>
    <small>100回</small>
  </button>

  <button onclick="startGame(200)">
    ガチ<br>
    <small>200回</small>
  </button>

  <div id="message"></div>

</div>

<script>

function startGame(rounds) {

  document.getElementById("message").textContent =
    rounds + "回モードを選択しました！";

}

</script>

</body>
</html>
