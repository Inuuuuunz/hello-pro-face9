<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ハロプロ好き顔9選メーカー</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f7f7f9;
  color:#222;
}
.wrap{max-width:720px;margin:auto;padding:24px 16px 50px}
h1{text-align:center;font-size:27px;margin:10px 0 8px}
.sub{text-align:center;color:#666;font-size:14px;margin-bottom:25px}
.card{
  background:white;border-radius:20px;padding:20px;
  box-shadow:0 3px 15px #00000010;margin-bottom:18px;
}
h2{font-size:19px;margin:0 0 15px}
button{
  border:0;border-radius:14px;padding:14px 18px;
  font-size:16px;font-weight:bold;cursor:pointer;
}
.mode{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.mode button{background:#222;color:white}
.mode button:last-child{background:#eee;color:#222}
input[type=file]{
  width:100%;padding:15px;border:2px dashed #ccc;
  border-radius:14px;background:#fafafa;
}
#preview{
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px;
}
.thumb{aspect-ratio:1;position:relative;overflow:hidden;border-radius:10px;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{
  position:absolute;left:5px;top:5px;background:#000b;color:white;
  border-radius:6px;padding:3px 6px;font-size:12px
}
#game{text-align:center}
.pair{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.face{
  border:3px solid transparent;background:white;border-radius:18px;
  padding:6px;cursor:pointer;transition:.15s;
}
.face:active{transform:scale(.97)}
.face img{
  width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;
}
.face div{font-weight:bold;padding:8px 2px}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:15px 0}
.progress i{display:block;height:100%;background:#222;width:0}
.small{font-size:13px;color:#777}
.hidden{display:none!important}
#resultCanvas{
  width:100%;display:block;border-radius:10px;
  background:white;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.actions button{background:#222;color:white}
.actions button:last-child{background:#eee;color:#222}
.notice{
  font-size:12px;line-height:1.7;color:#777;margin-top:18px
}
</style>
</head>

<body>
<div class="wrap">

<h1>ハロプロ好き顔9選メーカー</h1>
<div class="sub">あなたの「好き」をElo方式で遊ぶ9選メーカー</div>

<div id="setup" class="card">
  <h2>① 顔写真を9枚選択</h2>
  <p class="small">
    画像はこのブラウザ内だけで処理します。AIへの送信・学習は行いません。
  </p>

  <input id="files" type="file" accept="image/*" multiple>

  <div id="preview"></div>

  <div id="modeBox" class="hidden">
    <h2 style="margin-top:22px">② モードを選択</h2>
    <div class="mode">
      <button onclick="startGame(100)">STANDARD<br><small>100回</small></button>
      <button onclick="startGame(200)">ガチ<br><small>200回</small></button>
    </div>
  </div>
</div>

<div id="game" class="card hidden">
  <div id="roundText"></div>
  <div class="progress"><i id="bar"></i></div>

  <p class="small">直感で「好き！」と思う方をタップ</p>

  <div class="pair">
    <div class="face" onclick="vote(0)">
      <img id="imgA">
      <div>← こちら</div>
    </div>
    <div class="face" onclick="vote(1)">
      <img id="imgB">
      <div>こちら →</div>
    </
